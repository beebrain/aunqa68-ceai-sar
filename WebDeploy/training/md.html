<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เอกสาร — การอบรม CPE&AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
:root{--accent:#6D28D9;--ink:#1F2430;--muted:#5B6270;--line:#E6E2EF;--bg:#FAF9FC}
*{box-sizing:border-box}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;margin:0}
.bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;font-size:14px;z-index:5}
.bar a{color:var(--accent);text-decoration:none;font-weight:600}
main{max-width:880px;margin:0 auto;padding:36px 24px 80px}
#doc h1{font-size:30px;line-height:1.35;margin:0 0 18px}
#doc h2{font-size:23px;margin:34px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
#doc h3{font-size:19px;margin:26px 0 10px}
#doc p,#doc li{font-size:16px}
#doc ul,#doc ol{padding-left:26px}
#doc blockquote{border-left:4px solid var(--accent);background:#F1EBFB;padding:10px 18px;margin:16px 0;border-radius:0 10px 10px 0}
#doc blockquote p{margin:6px 0}
#doc code{background:#F0EDF6;border-radius:5px;padding:2px 6px;font-size:.9em}
#doc pre{background:#241A3E;color:#EDE7FA;padding:16px 20px;border-radius:12px;overflow-x:auto}
#doc pre code{background:none;color:inherit;padding:0}
#doc table{border-collapse:collapse;width:100%;margin:16px 0;display:block;overflow-x:auto}
#doc th,#doc td{border:1px solid var(--line);padding:8px 14px;font-size:15px;text-align:left;vertical-align:top}
#doc th{background:#F1EBFB}
#doc img{max-width:100%;border-radius:10px}
#doc a{color:var(--accent)}
.err{color:#B3261E;background:#FCEEEE;padding:14px 18px;border-radius:10px}
</style>
</head>
<body>
<div class="bar"><a href="javascript:history.back()">← กลับ</a></div>
<main><article id="doc"><p style="color:var(--muted)">กำลังโหลดเอกสาร…</p></article></main>
<script>
(async () => {
  const doc = document.getElementById('doc');
  const f = new URLSearchParams(location.search).get('f') || '';
  if (!f || f.includes('..') || f.startsWith('/') || !f.endsWith('.md')) {
    doc.innerHTML = '<p class="err">ไม่พบเอกสารที่ระบุ</p>'; return;
  }
  try {
    const res = await fetch(f);
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    doc.innerHTML = DOMPurify.sanitize(marked.parse(md));
    const h1 = doc.querySelector('h1');
    if (h1) document.title = h1.textContent + ' — การอบรม CPE&AI';
  } catch (e) {
    doc.innerHTML = '<p class="err">โหลดเอกสารไม่สำเร็จ (' + e.message + ')</p>';
  }
})();
</script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v3d52b47920f24c319d37e2661827c42b1787588026925" integrity="sha512-d9sL6GJLXn6fInD1+TVXhTcQOsmxeHfmHAvwGDIxp5TO+uo1fiWW7mHomMj4MLRlCsJDTqXzWLHJFFlPCEIj/A==" data-cf-beacon='{"version":"2024.11.0","token":"fc70359f2686407c96f3133bd97a4b06","r":1}' crossorigin="anonymous"></script>
</body>
</html>
